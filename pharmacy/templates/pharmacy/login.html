<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Вхід - ФармаПлюс</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">💊 ФармаПлюс</a>
    </div>
</nav>

<div class="container" style="max-width: 500px;">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h3 class="card-title text-center mb-4">Вхід у кабінет</h3>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary w-100 fs-5 mt-3">Увійти</button>
            </form>
            <div class="mt-3 text-center">
                <small>Немає акаунту? <a href="{% url 'register' %}">Зареєструватися</a></small>
            </div>
        </div>
    </div>
</div>

</body>
</html>
